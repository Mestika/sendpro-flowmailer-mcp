name: Bug report
description: Report a problem with the MCP server.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include SendPro credentials, message contents, or personal data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or MCP client configuration needed to reproduce the issue, with secrets redacted.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: false
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.0.0
    validations:
      required: false
